name: Desktop validation build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-intel:
    name: macOS Intel ZIP
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS Intel archive
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac:zip -- --x64

      - name: Create checksum
        working-directory: apps/desktop/release
        run: shasum -a 256 Hermes-*-mac-x64.zip > Hermes-mac-x64.sha256

      - name: Upload validation archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hermes-mac-x64-${{ github.sha }}
          path: |
            apps/desktop/release/Hermes-*-mac-x64.zip
            apps/desktop/release/Hermes-mac-x64.sha256
          if-no-files-found: error
          retention-days: 7
